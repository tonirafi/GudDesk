services:
  hbbr:
    image: rustdesk/rustdesk-server:latest
    container_name: guddesk-hbbr
    command: hbbr
    volumes:
      - ./data:/root
    network_mode: host
    restart: unless-stopped

  hbbs:
    image: rustdesk/rustdesk-server:latest
    container_name: guddesk-hbbs
    command: hbbs -r ${RELAY_HOST:-id.guddesk.gutekno.com}:21117
    volumes:
      - ./data:/root
    network_mode: host
    depends_on:
      - hbbr
    restart: unless-stopped

  web:
    image: nginx:alpine
    container_name: guddesk-web
    restart: unless-stopped
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data/id_ed25519.pub:/srv/key.pub:ro
      - ./downloads:/srv/downloads:ro
    networks:
      - gutekno_net
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=gutekno_net"
      - "traefik.http.routers.guddesk-http.rule=Host(`${DOMAIN:-guddesk.gutekno.com}`)"
      - "traefik.http.routers.guddesk-http.entrypoints=web"
      - "traefik.http.routers.guddesk-http.middlewares=guddesk-redirect"
      - "traefik.http.middlewares.guddesk-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.guddesk-https.rule=Host(`${DOMAIN:-guddesk.gutekno.com}`)"
      - "traefik.http.routers.guddesk-https.entrypoints=websecure"
      - "traefik.http.routers.guddesk-https.tls=true"
      - "traefik.http.routers.guddesk-https.tls.certresolver=letsencrypt"
      - "traefik.http.services.guddesk.loadbalancer.server.port=80"
    depends_on:
      - hbbs

networks:
  gutekno_net:
    external: true
