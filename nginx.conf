server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location = /key.pub {
        alias /srv/key.pub;
        default_type text/plain;
        add_header Cache-Control "no-store";
    }

    location = /download/builds.json {
        alias /srv/downloads/builds.json;
        default_type application/json;
        add_header Cache-Control "no-store";
    }

    location /download/ {
        # A types block replaces nginx's whole MIME table, so keep it scoped to downloads.
        types {
            application/vnd.android.package-archive apk;
            application/vnd.debian.binary-package deb;
        }
        alias /srv/downloads/;
        # Chrome on Android downloads in parallel ranges and then sits forever at the final
        # byte count. One plain response, which it cannot resume, finishes instead.
        max_ranges 0;
        etag off;
        if_modified_since off;
        # private: the browser may keep the file, Cloudflare may not. A cached copy is what
        # keeps serving the parallel ranges that Chrome never finishes.
        add_header Cache-Control "private";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
